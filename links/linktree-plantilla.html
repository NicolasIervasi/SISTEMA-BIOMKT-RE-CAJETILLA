<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nombre del Cliente</title>
<meta name="description" content="Todos los links en un solo lugar.">

<!-- ============================================================
     OPEN GRAPH — lo que se ve cuando se comparte el link
     Cambiar url e image por las definitivas al publicar.
     ============================================================ -->
<meta property="og:type" content="website">
<meta property="og:title" content="Nombre del Cliente">
<meta property="og:description" content="Todos los links en un solo lugar.">
<meta property="og:image" content="">
<meta name="theme-color" content="#635BA7">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   1. MARCA — tocar SOLO estos valores para cambiar el look
   ============================================================ */
:root{
  --brand:        #635BA7;   /* color principal: botones, acentos */
  --brand-oscuro: #4A4380;   /* variante para hover/degradé */
  --fondo:        #0E0C18;   /* fondo de la página */
  --fondo-2:      #191430;   /* segundo tono del degradé de fondo */
  --tarjeta:      rgba(255,255,255,.07);
  --borde:        rgba(255,255,255,.12);
  --texto:        #F6F4FF;
  --texto-suave:  rgba(246,244,255,.62);
  --radio:        16px;
  --ancho:        420px;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--fondo);
  background-image:
    radial-gradient(900px 500px at 50% -10%, var(--brand) 0%, transparent 60%),
    linear-gradient(180deg, var(--fondo-2) 0%, var(--fondo) 55%);
  background-attachment:fixed;
  color:var(--texto);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:56px 20px 40px;
  -webkit-font-smoothing:antialiased;
}

.contenedor{width:100%;max-width:var(--ancho)}

/* ============================================================
   2. CABECERA — foto, nombre, rubro, bio
   ============================================================ */
.foto{
  width:104px;height:104px;border-radius:50%;
  margin:0 auto 18px;display:block;
  object-fit:cover;
  border:3px solid rgba(255,255,255,.22);
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  background:linear-gradient(135deg,var(--brand),var(--brand-oscuro));
}
/* Fallback con iniciales si todavía no hay foto */
.foto-iniciales{
  width:104px;height:104px;border-radius:50%;
  margin:0 auto 18px;display:flex;align-items:center;justify-content:center;
  font-size:38px;font-weight:700;letter-spacing:-1px;
  background:linear-gradient(135deg,var(--brand),var(--brand-oscuro));
  border:3px solid rgba(255,255,255,.22);
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.nombre{font-size:23px;font-weight:700;text-align:center;letter-spacing:-.3px}
.rubro{
  text-align:center;margin-top:7px;font-size:12px;font-weight:600;
  letter-spacing:1.3px;text-transform:uppercase;color:var(--texto-suave);
}
.bio{
  text-align:center;margin:14px auto 0;max-width:330px;
  font-size:14.5px;line-height:1.55;color:var(--texto-suave);
}

/* ============================================================
   3. BOTONES DE LINKS
   ============================================================ */
.links{margin-top:30px;display:flex;flex-direction:column;gap:12px}

.link{
  display:flex;align-items:center;gap:13px;
  padding:16px 18px;
  background:var(--tarjeta);
  border:1px solid var(--borde);
  border-radius:var(--radio);
  color:var(--texto);text-decoration:none;
  font-size:15px;font-weight:600;
  backdrop-filter:blur(12px);
  transition:transform .18s ease, background .18s ease, border-color .18s ease;
}
.link:hover{transform:translateY(-2px);background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.28)}
.link:active{transform:translateY(0)}

/* Botón destacado: el CTA principal (turnos, comprar, reservar) */
.link.destacado{
  background:linear-gradient(135deg,var(--brand),var(--brand-oscuro));
  border-color:transparent;
  box-shadow:0 8px 24px rgba(99,91,167,.42);
}
.link.destacado:hover{background:linear-gradient(135deg,var(--brand),var(--brand))}

.icono{
  width:36px;height:36px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:10px;background:rgba(255,255,255,.1);
}
.icono svg{width:19px;height:19px;fill:currentColor}
.texto-link{flex:1;min-width:0}
.texto-link .titulo{display:block}
.texto-link .sub{
  display:block;margin-top:2px;font-size:12.5px;font-weight:400;
  color:var(--texto-suave);
}
.link.destacado .texto-link .sub{color:rgba(255,255,255,.78)}
.flecha{opacity:.4;flex-shrink:0}

/* ============================================================
   4. REDES (fila de iconos) Y PIE
   ============================================================ */
.redes{display:flex;justify-content:center;gap:14px;margin-top:30px}
.red{
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--tarjeta);border:1px solid var(--borde);
  color:var(--texto);transition:transform .18s ease,background .18s ease;
}
.red:hover{transform:translateY(-2px);background:rgba(255,255,255,.15)}
.red svg{width:18px;height:18px;fill:currentColor}

.pie{
  margin-top:34px;text-align:center;
  font-size:11.5px;letter-spacing:.4px;color:rgba(246,244,255,.35);
}
.pie a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(246,244,255,.2)}

@media(max-width:400px){
  body{padding:40px 16px 32px}
  .nombre{font-size:21px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
